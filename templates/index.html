{% extends "base.html" %}
{% block content %}
<div class="container">
    <h1>Estimate Your Insurance Costs</h1>
    <form method="POST" action="{{ url_for('predict') }}">
        <div class="form-group">
            <input type="text" name="age" placeholder="Enter Your Age" required>
        </div>
        <div class="form-group">
            <input type="text" name="sex" placeholder="Male Or Female [1/0]" required>
        </div>
        <div class="form-group">
            <input type="text" name="bmi" placeholder="Enter Your BMI Value" required>
        </div>
        <div class="form-group">
            <input type="text" name="children" placeholder="Enter Number of Children" required>
        </div>
        <div class="form-group">
            <input type="text" name="smoker" placeholder="Smoker Yes/No [1/0]" required>
        </div>
        <div class="form-group">
            <input type="text" name="region" placeholder="Region [1-4]" required>
        </div>
        <button type="submit">Get Your Estimate</button>
    </form>
    <div class="result">
        {% if prediction_text %}
            <p>{{ prediction_text }}</p>
        {% endif %}
    </div>
</div>
{% endblock %}
